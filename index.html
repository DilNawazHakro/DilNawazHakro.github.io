<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prof. Dr. Dil Nawaz Hakro</title>
<meta name="description" content="Academic profile: roles, research interests, projects and citation metrics.">
<style>
  :root { --bg:#f7f8fa; --card:#fff; --ink:#1c2330; --mute:#5b6678; --line:#dde2ea; --accent:#1f4e8c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --card:#1a2029; --ink:#e8ecf2; --mute:#9aa6b8; --line:#2a3340; --accent:#7fb0ee; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 Georgia,"Times New Roman",serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:2rem; margin:0 0 4px; }
  h2 { font-size:1.15rem; margin:36px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line); color:var(--accent); }
  .tag { color:var(--mute); margin:0 0 16px; font-size:1.05rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
  .card b { display:block; }
  .card span { color:var(--mute); font-size:.95rem; }
  ul.chips { list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:8px; }
  ul.chips li { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:.92rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .metric { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center; }
  .metric .n { font-size:1.9rem; line-height:1.2; }
  .metric .l { color:var(--mute); font-size:.85rem; }
  .src { color:var(--mute); font-size:.82rem; margin:6px 0 0; }
  a { color:var(--accent); }
  nav { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; z-index:5; }
  nav ul { list-style:none; margin:0 auto; padding:0; max-width:960px; display:flex; flex-wrap:wrap; gap:6px 18px; font-size:.95rem; }
  nav a { text-decoration:none; }
  .pub { margin-bottom:10px; }
  .pub .t { font-weight:bold; }
  .foot { margin-top:48px; color:var(--mute); font-size:.82rem; border-top:1px solid var(--line); padding-top:12px; }
  .btn { display:inline-block; margin-top:10px; padding:6px 14px; border:1px solid var(--accent); border-radius:6px; text-decoration:none; font-size:.92rem; }
  @media print { nav { display:none; } }
  #err { display:none; padding:12px; border:1px solid #c0392b; border-radius:6px; }
</style>
</head>
<body>
<nav><ul id="menu"></ul></nav>
<main>
  <div id="err">Could not load data.json. Make sure it is uploaded in the same folder as index.html.</div>
  <header>
    <h1 id="name"></h1>
    <p class="tag" id="tagline"></p>
    <p id="summary"></p>
    <ul class="chips" id="links"></ul>
  </header>

  <section id="s-roles"><h2>Roles</h2><div id="roles"></div></section>
  <section id="s-interests"><h2>Research interests</h2><ul class="chips" id="interests"></ul></section>
  <section id="s-projects"><h2>Projects</h2><div id="projects"></div></section>
  <section id="s-pubs"><h2>Selected publications</h2><div id="pubs"></div></section>
  <section id="s-gs"><h2>Google Scholar</h2><div class="grid" id="gs"></div><p class="src" id="gs-src"></p></section>
  <section id="s-wos"><h2>Web of Science</h2><div class="grid" id="wos"></div><p class="src" id="wos-src"></p></section>
  <p class="foot" id="foot"></p>
</main>

<script>
// All content comes from data.json. To update the site, edit data.json only.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function has(v) { return v !== null && v !== undefined && v !== ''; }
function metric(parent, value, label) {
  if (!has(value)) return;
  const m = el('div', 'metric');
  m.append(el('div', 'n', String(value)), el('div', 'l', label));
  parent.append(m);
}
function source(p, name, retrieved, url) {
  if (has(retrieved)) {
    p.textContent = 'Source: ' + name + '. Retrieved ' + retrieved + '. ';
    if (has(url) && /^https?:\/\//.test(url)) {
      const a = el('a', null, 'View profile');
      a.href = url; a.rel = 'noopener';
      p.append(a);
    }
  }
}
function hide(id) { document.getElementById(id).style.display = 'none'; }

fetch('data.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    document.getElementById('name').textContent = d.name || '';
    document.title = d.name || document.title;
    document.getElementById('tagline').textContent = d.tagline || '';
    document.getElementById('summary').textContent = d.summary || '';

    const links = document.getElementById('links');
    (d.links || []).forEach(l => {
      if (!has(l.url) || !/^https?:\/\//.test(l.url)) return;
      const li = el('li'); const a = el('a', null, l.label || l.url);
      a.href = l.url; a.rel = 'noopener'; li.append(a); links.append(li);
    });

    const roles = document.getElementById('roles');
    (d.roles || []).forEach(r => {
      const c = el('div', 'card');
      c.append(el('b', null, r.title), el('span', null, [r.organization, r.period].filter(has).join(' · ')));
      roles.append(c);
    });
    if (!(d.roles || []).length) hide('s-roles');

    const ints = document.getElementById('interests');
    (d.research_interests || []).forEach(t => ints.append(el('li', null, t)));
    if (!(d.research_interests || []).length) hide('s-interests');

    const proj = document.getElementById('projects');
    (d.projects || []).forEach(p => {
      const c = el('div', 'card');
      c.append(el('b', null, p.title));
      const meta = [p.role, p.organization, p.period].filter(has).join(' · ');
      if (meta) c.append(el('span', null, meta));
      if (has(p.description)) c.append(el('div', null, p.description));
      proj.append(c);
    });
    if (!(d.projects || []).length) hide('s-projects');

    const pubs = document.getElementById('pubs');
    (d.publications || []).forEach(p => {
      const c = el('div', 'card pub');
      c.append(el('div', 't', p.title));
      c.append(el('span', null, [p.authors, p.venue, p.year].filter(has).join(' · ')));
      if (has(p.doi)) {
        c.append(document.createElement('br'));
        const a = el('a', null, 'doi:' + p.doi);
        a.href = 'https://doi.org/' + encodeURIComponent(p.doi).replace(/%2F/g, '/'); a.rel = 'noopener';
        c.append(a);
      }
      pubs.append(c);
    });
    if (!(d.publications || []).length) hide('s-pubs');

    const gs = (d.metrics || {}).google_scholar || {};
    const gsEl = document.getElementById('gs');
    metric(gsEl, gs.citations, 'Citations (all)');
    metric(gsEl, gs.citations_since, 'Citations since ' + (gs.since_year || ''));
    metric(gsEl, gs.h_index, 'h-index');
    metric(gsEl, gs.i10_index, 'i10-index');
    if (has(gs.url) && /^https?:\/\//.test(gs.url)) {
      const a = el('a', 'btn', 'Open Google Scholar profile');
      a.href = gs.url; a.rel = 'noopener';
      gsEl.after(a);
    } else if (!gsEl.children.length) hide('s-gs');
    source(document.getElementById('gs-src'), 'Google Scholar', gs.retrieved, gs.url);

    const w = (d.metrics || {}).web_of_science || {};
    const wEl = document.getElementById('wos');
    metric(wEl, w.total_documents, 'Total documents');
    metric(wEl, w.indexed_publications, 'Indexed in Web of Science');
    metric(wEl, w.core_collection_publications, 'Core Collection publications');
    metric(wEl, w.h_index, 'h-index (Core Collection)');
    metric(wEl, w.times_cited, 'Times cited');
    metric(wEl, w.citing_articles, 'Citing articles');
    metric(wEl, w.times_cited_without_self, 'Times cited (no self-citations)');
    metric(wEl, w.citing_articles_without_self, 'Citing articles (no self-citations)');
    metric(wEl, w.preprints, 'Preprints');
    metric(wEl, w.verified_peer_reviews, 'Verified peer reviews');
    if (!wEl.children.length) hide('s-wos');
    source(document.getElementById('wos-src'), 'Web of Science (Clarivate)', w.retrieved, w.url);

    // menu from the visible sections
    const menu = document.getElementById('menu');
    document.querySelectorAll('main section').forEach(s => {
      if (s.style.display === 'none') return;
      const t = s.querySelector('h2'); if (!t) return;
      s.id = s.id || 'sec'; const li = el('li'); const a = el('a', null, t.textContent);
      a.href = '#' + s.id; li.append(a); menu.append(li);
    });
    if (has(d.last_updated)) document.getElementById('foot').textContent = 'Last updated: ' + d.last_updated;
  })
  .catch(() => { document.getElementById('err').style.display = 'block'; });
</script>
</body>
</html>
